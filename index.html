<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ClipperHub — iGaming Creator Distribution Demo</title>
  <meta name="description" content="Demo marketplace for licensed iGaming brands to distribute approved clip briefs through independent creators." />
  <style>:root{--bg:#0a0b0e;--panel:#111318;--panel2:#171a20;--line:#272b33;--text:#f5f6f7;--muted:#8b929e;--green:#a8ff60;--green2:#62d81d;--amber:#ffcc66;--red:#ff6b6b;--blue:#6ea8fe;--shadow:0 18px 50px rgba(0,0,0,.28)}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.sidebar{position:sticky;top:0;height:100vh;padding:26px 18px;border-right:1px solid var(--line);background:#0d0f12;display:flex;flex-direction:column}.brand{display:flex;gap:12px;align-items:center;padding:0 8px 24px}.brand-mark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--green);color:#0a0b0e;font-weight:900}.brand strong,.brand span{display:block}.brand span{font-size:11px;color:var(--muted);margin-top:2px}.nav-btn{width:100%;border:0;background:transparent;color:#aeb4bd;text-align:left;padding:11px 12px;margin:3px 0;border-radius:9px;cursor:pointer;display:flex;gap:10px;align-items:center}.nav-btn:hover,.nav-btn.active{background:#191c22;color:#fff}.nav-icon{width:20px;color:var(--muted)}.compliance-card{margin-top:auto;border:1px solid #304327;background:#11180e;border-radius:12px;padding:12px;display:flex;gap:9px}.compliance-card strong,.compliance-card span{display:block}.compliance-card strong{font-size:12px}.compliance-card span{font-size:10px;line-height:1.4;color:#9aa892;margin-top:4px}.dot{width:8px;height:8px;border-radius:50%;background:var(--green);margin-top:4px;box-shadow:0 0 14px var(--green)}.main{padding:26px 34px 60px;min-width:0}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}.eyebrow{font-size:10px;letter-spacing:.16em;color:var(--green);font-weight:800;margin:0 0 6px}.topbar h1{margin:0;font-size:28px}.top-actions{display:flex;align-items:center;gap:12px}.role-switch{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}.role-switch select{background:var(--panel2);color:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 30px 8px 10px}.avatar{border:1px solid var(--line);background:#20242b;color:#fff;width:38px;height:38px;border-radius:50%;font-weight:700}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:22px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}.stat-label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em}.stat-value{font-size:28px;font-weight:800;margin-top:8px}.stat-sub{font-size:11px;color:#7f8792;margin-top:6px}.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:18px 0}.filters{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:#121419;color:#aab0ba;border-radius:999px;padding:7px 11px;font-size:12px;cursor:pointer}.chip.active{background:#ecfbdc;color:#1c2911;border-color:#ecfbdc;font-weight:700}.primary{border:0;background:var(--green);color:#10150c;border-radius:9px;padding:10px 14px;font-weight:800;cursor:pointer}.primary:hover{background:#b9ff7d}.secondary{border:1px solid var(--line);background:#191c22;color:#fff;border-radius:9px;padding:9px 13px;cursor:pointer}.danger{border:1px solid #5f3232;background:#261414;color:#ffaaaa;border-radius:8px;padding:7px 10px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{border:1px solid var(--line);background:var(--panel);border-radius:15px;overflow:hidden;box-shadow:var(--shadow)}.campaign-art{height:110px;padding:18px;display:flex;align-items:flex-end;justify-content:space-between;background:radial-gradient(circle at 80% 20%,#2a4b22 0,transparent 42%),linear-gradient(135deg,#161b16,#0e1012)}.brand-pill{background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:6px 9px;font-size:11px}.budget-pill{background:var(--green);color:#11170d;border-radius:999px;padding:6px 9px;font-size:11px;font-weight:900}.card-body{padding:16px}.card h3{margin:0 0 7px;font-size:17px}.card p{color:#9da4ae;font-size:12px;line-height:1.5;margin:0}.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:15px 0}.meta div{background:#171a20;border-radius:9px;padding:9px}.meta span{display:block;color:#777f8a;font-size:9px;text-transform:uppercase}.meta strong{font-size:12px;display:block;margin-top:4px}.card-actions{display:flex;gap:8px}.card-actions button{flex:1}.status{display:inline-flex;align-items:center;gap:5px;border-radius:999px;font-size:10px;font-weight:800;padding:5px 8px}.status.live,.status.approved{background:#193018;color:#a8ff60}.status.pending,.status.review{background:#352b15;color:#ffd57a}.status.rejected{background:#321b1b;color:#ff9696}.status.draft{background:#252832;color:#b8bfca}.table-wrap{border:1px solid var(--line);background:var(--panel);border-radius:14px;overflow:auto}.table{width:100%;border-collapse:collapse;min-width:820px}.table th,.table td{padding:13px 14px;text-align:left;border-bottom:1px solid #20242b;font-size:12px}.table th{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:#707986;background:#101216}.table td{color:#c8cdd4}.link{color:var(--blue);cursor:pointer;text-decoration:none}.empty{border:1px dashed #303540;border-radius:14px;padding:40px;text-align:center;color:var(--muted)}.split{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}.panel{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:17px}.panel h3{margin:0 0 13px;font-size:15px}.list-item{padding:12px 0;border-bottom:1px solid #20242b;display:flex;justify-content:space-between;gap:15px}.list-item:last-child{border:0}.list-item small{color:var(--muted)}.modal{border:1px solid #343943;background:#111318;color:#fff;border-radius:16px;padding:0;max-width:620px;width:calc(100% - 30px);box-shadow:0 30px 100px rgba(0,0,0,.6)}.modal::backdrop{background:rgba(0,0,0,.72);backdrop-filter:blur(4px)}.modal-inner{padding:22px}.modal-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:17px}.modal-head h2{margin:0}.x{background:transparent;border:0;color:#8f97a3;font-size:23px;cursor:pointer}.form{display:grid;gap:12px}.field label{display:block;color:#9199a4;font-size:11px;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid #303540;background:#0d0f12;color:#fff;border-radius:9px;padding:10px}.field textarea{min-height:90px;resize:vertical}.notice{background:#141c10;border:1px solid #2b4522;border-radius:10px;color:#b9dca3;padding:10px 12px;font-size:11px;line-height:1.5}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.toast{position:fixed;right:22px;bottom:22px;background:#eafcda;color:#16200e;border-radius:10px;padding:12px 16px;font-weight:700;transform:translateY(30px);opacity:0;pointer-events:none;transition:.25s}.toast.show{transform:translateY(0);opacity:1}.bar{height:7px;background:#242832;border-radius:99px;overflow:hidden;margin-top:8px}.bar>i{display:block;height:100%;background:var(--green);border-radius:99px}.kpi-row{display:flex;justify-content:space-between;align-items:end}.muted{color:var(--muted)}.tiny{font-size:10px}.heading-row{display:flex;justify-content:space-between;align-items:center;margin:24px 0 12px}.heading-row h2{font-size:16px;margin:0}.tag{display:inline-block;border:1px solid #323741;border-radius:999px;padding:4px 7px;font-size:9px;color:#9ba3ae;margin:3px 3px 0 0}.rank{display:flex;align-items:center;gap:10px}.rank-num{width:25px;height:25px;background:#20242b;border-radius:7px;display:grid;place-items:center;font-size:10px;font-weight:800}.progress-label{display:flex;justify-content:space-between;font-size:10px;color:var(--muted)}@media(max-width:1000px){.shell{grid-template-columns:72px 1fr}.sidebar{padding:22px 10px}.brand>div:not(.brand-mark),.nav-text,.compliance-card{display:none}.brand{padding-left:9px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:680px){.main{padding:20px 14px}.topbar{align-items:flex-start;gap:12px}.top-actions{flex-direction:column;align-items:flex-end}.role-switch{font-size:0}.grid,.split{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.campaign-art{height:95px}.shell{grid-template-columns:1fr}.sidebar{position:static;height:auto;display:none}}
</style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><div class="brand-mark">C</div><div><strong>ClipperHub</strong><span>distribution network</span></div></div>
      <nav id="nav"></nav>
      <div class="compliance-card">
        <div class="dot"></div>
        <div><strong>Demo compliance mode</strong><span>Licensed operators • 18+ • geo rules • manual review</span></div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div><p class="eyebrow" id="eyebrow">CLIPPER WORKSPACE</p><h1 id="pageTitle">Campaigns</h1></div>
        <div class="top-actions">
          <label class="role-switch">View as
            <select id="roleSelect">
              <option value="clipper">Clipper</option>
              <option value="brand">Brand</option>
              <option value="admin">Admin</option>
            </select>
          </label>
          <button class="avatar">DL</button>
        </div>
      </header>
      <section id="app"></section>
    </main>
  </div>

  <dialog id="modal" class="modal"><div id="modalContent"></div></dialog>
  <div id="toast" class="toast"></div>
  <script>const seed = {
  campaigns:[
    {id:'c1',brand:'NovaBet Sports',title:'Champions Night Reaction Clips',platforms:'TikTok, Reels, Shorts',geo:'MY / PH',budget:2500,spent:760,rate:'$4 / 1K verified views',deadline:'24 Oct',status:'live',claimed:38,submissions:21,brief:'Create 15–35s match-reaction edits using the supplied licensed sports footage. Add your own commentary or captions. Do not promise winnings or target minors.',requirements:['18+ audience','Use supplied footage only','#ad / sponsored disclosure','No guaranteed-win language']},
    {id:'c2',brand:'AceOdds',title:'Weekend Football Talking Points',platforms:'TikTok, Shorts',geo:'TH / ID',budget:1800,spent:510,rate:'$35 approved clip + bonus',deadline:'20 Oct',status:'live',claimed:22,submissions:14,brief:'Turn the approved talking points into original short-form commentary. The clipper must add meaningful editing/commentary and use the approved end card.',requirements:['Approved end card','Local-language captions','18+ only','Geo exclusions apply']},
    {id:'c3',brand:'PlayOrbit',title:'Responsible Play Explainer',platforms:'Reels, TikTok',geo:'Global approved',budget:1200,spent:180,rate:'$45 approved clip',deadline:'29 Oct',status:'live',claimed:16,submissions:6,brief:'Create concise explainer clips covering bankroll limits, timeout tools, and responsible-play controls. Educational tone; no inducements.',requirements:['Educational only','No bonus claims','Responsible gaming CTA','18+']}
  ],
  submissions:[
    {id:'s1',campaignId:'c1',clipper:'@goalframe',url:'https://tiktok.com/@goalframe/video/demo1',platform:'TikTok',views:48200,status:'approved',payout:192.8,submitted:'13 Oct'},
    {id:'s2',campaignId:'c2',clipper:'@footballcutmy',url:'https://youtube.com/shorts/demo2',platform:'Shorts',views:19300,status:'review',payout:0,submitted:'14 Oct'},
    {id:'s3',campaignId:'c1',clipper:'@matchpulse',url:'https://instagram.com/reel/demo3',platform:'Reels',views:27100,status:'pending',payout:0,submitted:'14 Oct'},
    {id:'s4',campaignId:'c3',clipper:'@sportbrief',url:'https://tiktok.com/@sportbrief/video/demo4',platform:'TikTok',views:12600,status:'approved',payout:45,submitted:'12 Oct'},
    {id:'s5',campaignId:'c2',clipper:'@bettersportsedit',url:'https://tiktok.com/@bettersportsedit/video/demo5',platform:'TikTok',views:8400,status:'rejected',payout:0,submitted:'12 Oct'}
  ],
  claims:['c1'],
  notifications:[
    {text:'NovaBet submission approved',time:'2h ago'},
    {text:'New brief: Responsible Play Explainer',time:'5h ago'},
    {text:'$192.80 moved to payable balance',time:'Yesterday'}
  ]
};

let state = JSON.parse(localStorage.getItem('clipperHubDemo')||'null') || structuredClone(seed);
let role = localStorage.getItem('clipperHubRole') || 'clipper';
let page = 'dashboard';
const app=document.querySelector('#app'),nav=document.querySelector('#nav'),modal=document.querySelector('#modal'),modalContent=document.querySelector('#modalContent');
const $=s=>document.querySelector(s); const money=n=>`$${Number(n).toLocaleString(undefined,{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2})}`;
const save=()=>localStorage.setItem('clipperHubDemo',JSON.stringify(state));
const campaign=id=>state.campaigns.find(c=>c.id===id);
const status=s=>`<span class="status ${s}">● ${s.toUpperCase()}</span>`;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
function navConfig(){return role==='clipper'?[['dashboard','▦','Discover'],['submissions','↗','My submissions'],['earnings','$','Earnings'],['leaderboard','★','Leaderboard']]:role==='brand'?[['dashboard','▦','Overview'],['campaigns','◫','Campaigns'],['submissions','↗','Submissions'],['clippers','◎','Clippers']]:[['dashboard','▦','Control room'],['submissions','↗','Review queue'],['campaigns','◫','Campaigns'],['compliance','✓','Compliance']];}
function renderNav(){nav.innerHTML=navConfig().map(([p,i,t])=>`<button class="nav-btn ${page===p?'active':''}" data-page="${p}"><span class="nav-icon">${i}</span><span class="nav-text">${t}</span></button>`).join('');nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});}
function setHead(title,eye){$('#pageTitle').textContent=title;$('#eyebrow').textContent=eye;}
function stat(label,val,sub=''){return `<div class="stat"><div class="stat-label">${label}</div><div class="stat-value">${val}</div><div class="stat-sub">${sub}</div></div>`}
function campaignCard(c){const pct=Math.min(100,Math.round(c.spent/c.budget*100));return `<article class="card"><div class="campaign-art"><span class="brand-pill">${c.brand}</span><span class="budget-pill">${money(c.budget-c.spent)} left</span></div><div class="card-body"><div>${status(c.status)}</div><h3>${c.title}</h3><p>${c.brief.slice(0,105)}…</p><div class="meta"><div><span>Payout</span><strong>${c.rate}</strong></div><div><span>Geo</span><strong>${c.geo}</strong></div><div><span>Ends</span><strong>${c.deadline}</strong></div></div><div class="progress-label"><span>Budget used</span><span>${pct}%</span></div><div class="bar"><i style="width:${pct}%"></i></div><div class="card-actions" style="margin-top:13px"><button class="secondary" onclick="openCampaign('${c.id}')">View brief</button>${role==='clipper'?`<button class="primary" onclick="claimCampaign('${c.id}')">${state.claims.includes(c.id)?'Submit clip':'Claim brief'}</button>`:''}</div></div></article>`}
function clipperDashboard(){setHead('Campaigns','CLIPPER WORKSPACE');const approved=state.submissions.filter(s=>s.clipper==='@goalframe'&&s.status==='approved');const earned=approved.reduce((a,s)=>a+s.payout,0);app.innerHTML=`<div class="stats">${stat('Available campaigns',state.campaigns.filter(c=>c.status==='live').length,'Approved campaigns open now')}${stat('Active briefs',state.claims.length,'Claimed by you')}${stat('Approved earnings',money(earned),'Demo payable balance')}${stat('Approval rate','92%','Across last 30 submissions')}</div><div class="toolbar"><div class="filters"><button class="chip active">All</button><button class="chip">Football</button><button class="chip">TikTok</button><button class="chip">Fixed fee</button><button class="chip">Performance</button></div></div><div class="grid">${state.campaigns.map(campaignCard).join('')}</div>`}
function submissionTable(rows,admin=false){return `<div class="table-wrap"><table class="table"><thead><tr><th>Clip</th><th>Campaign</th><th>Creator</th><th>Views</th><th>Status</th><th>Payout</th>${admin?'<th>Action</th>':''}</tr></thead><tbody>${rows.map(s=>{const c=campaign(s.campaignId);return `<tr><td><a class="link" href="${s.url}" target="_blank">${s.platform} ↗</a><div class="tiny muted">${s.submitted}</div></td><td>${c?.title||'—'}</td><td>${s.clipper}</td><td>${s.views.toLocaleString()}</td><td>${status(s.status)}</td><td>${money(s.payout)}</td>${admin?`<td>${['pending','review'].includes(s.status)?`<button class="primary" onclick="reviewSubmission('${s.id}')">Review</button>`:'—'}</td>`:''}</tr>`}).join('')}</tbody></table></div>`}
function clipperSubmissions(){setHead('My submissions','CLIPPER WORKSPACE');const mine=state.submissions.filter(s=>s.clipper==='@goalframe'||s.id.startsWith('local-'));app.innerHTML=`<div class="stats">${stat('Submitted',mine.length,'All demo submissions')}${stat('Approved',mine.filter(s=>s.status==='approved').length,'Ready for payout')}${stat('In review',mine.filter(s=>['pending','review'].includes(s.status)).length,'Awaiting moderation')}${stat('Verified views',mine.reduce((a,s)=>a+s.views,0).toLocaleString(),'Approved + pending')}</div>${submissionTable(mine)}`}
function earnings(){setHead('Earnings','CLIPPER WORKSPACE');const mine=state.submissions.filter(s=>s.clipper==='@goalframe'||s.id.startsWith('local-'));const earned=mine.filter(s=>s.status==='approved').reduce((a,s)=>a+s.payout,0);app.innerHTML=`<div class="stats">${stat('Payable',money(earned),'Demo only — no payment rail connected')}${stat('Pending',money(mine.filter(s=>s.status!=='approved').reduce((a,s)=>a+s.payout,0)),'Awaiting approval')}${stat('Clips approved',mine.filter(s=>s.status==='approved').length,'Lifetime demo')}${stat('Avg. CPM','$4.00','Performance campaigns')}</div><div class="split"><div class="panel"><h3>Payout ledger</h3>${mine.map(s=>`<div class="list-item"><div><strong>${campaign(s.campaignId)?.title}</strong><br><small>${s.platform} • ${s.views.toLocaleString()} verified views</small></div><div><strong>${money(s.payout)}</strong><br><small>${s.status}</small></div></div>`).join('')}</div><div class="panel"><h3>How demo payouts work</h3><p class="muted" style="font-size:12px;line-height:1.6">Performance campaigns calculate a payable amount only after a moderator marks a submission approved and enters verified views. Fixed-fee campaigns pay the configured approved-clip amount. Real payment processing is intentionally not connected.</p></div></div>`}
function leaderboard(){setHead('Leaderboard','CLIPPER WORKSPACE');const people=[['@goalframe','184K','$738'],['@matchpulse','162K','$612'],['@footballcutmy','151K','$574'],['@sportbrief','119K','$488'],['@editminute','96K','$365']];app.innerHTML=`<div class="panel"><h3>Top clippers — demo month</h3>${people.map((p,i)=>`<div class="list-item"><div class="rank"><div class="rank-num">${i+1}</div><div><strong>${p[0]}</strong><br><small>${p[1]} verified views</small></div></div><strong>${p[2]}</strong></div>`).join('')}</div>`}
function brandDashboard(){setHead('Brand overview','BRAND WORKSPACE');const totalBudget=state.campaigns.reduce((a,c)=>a+c.budget,0),spent=state.campaigns.reduce((a,c)=>a+c.spent,0),views=state.submissions.reduce((a,s)=>a+s.views,0);app.innerHTML=`<div class="stats">${stat('Campaign budget',money(totalBudget),'Across demo campaigns')}${stat('Spent / approved',money(spent),`${Math.round(spent/totalBudget*100)}% budget utilized`)}${stat('Submitted clips',state.submissions.length,'Across all platforms')}${stat('Tracked views',views.toLocaleString(),'Demo verification data')}</div><div class="split"><div class="panel"><div class="heading-row" style="margin-top:0"><h3>Campaign performance</h3><button class="primary" onclick="newCampaign()">+ New campaign</button></div>${state.campaigns.map(c=>`<div class="list-item"><div><strong>${c.title}</strong><br><small>${c.claimed} clippers • ${c.submissions} submissions</small></div><div style="text-align:right"><strong>${money(c.spent)} / ${money(c.budget)}</strong><br><small>${c.geo}</small></div></div>`).join('')}</div><div class="panel"><h3>Latest activity</h3>${state.notifications.map(n=>`<div class="list-item"><div>${n.text}<br><small>${n.time}</small></div></div>`).join('')}</div></div>`}
function campaignManagement(){setHead('Campaigns','BRAND WORKSPACE');app.innerHTML=`<div class="heading-row"><div><span class="muted tiny">Create briefs, budgets and allowed geos.</span></div><button class="primary" onclick="newCampaign()">+ New campaign</button></div><div class="grid">${state.campaigns.map(campaignCard).join('')}</div>`}
function clippers(){setHead('Clippers','BRAND WORKSPACE');const people=[['@goalframe','Football / EN','92%','184K'],['@matchpulse','Football / BM','89%','162K'],['@footballcutmy','Football / EN','95%','151K'],['@sportbrief','Education / EN','97%','119K']];app.innerHTML=`<div class="table-wrap"><table class="table"><thead><tr><th>Clipper</th><th>Niche</th><th>Approval</th><th>Verified views</th><th>Trust</th></tr></thead><tbody>${people.map(p=>`<tr><td><strong>${p[0]}</strong></td><td>${p[1]}</td><td>${p[2]}</td><td>${p[3]}</td><td><span class="status approved">● VERIFIED</span></td></tr>`).join('')}</tbody></table></div>`}
function adminDashboard(){setHead('Control room','ADMIN WORKSPACE');const q=state.submissions.filter(s=>['pending','review'].includes(s.status));app.innerHTML=`<div class="stats">${stat('Review queue',q.length,'Needs manual decision')}${stat('Live campaigns',state.campaigns.filter(c=>c.status==='live').length,'Licensed-operator demo')}${stat('Approved today',state.submissions.filter(s=>s.status==='approved').length,'Demo records')}${stat('Policy flags','1','Synthetic demo flag')}</div><div class="split"><div><div class="heading-row" style="margin-top:0"><h2>Needs review</h2></div>${submissionTable(q,true)}</div><div class="panel"><h3>Guardrails</h3>${['Operator licensing attestation','18+ creator / audience rule','Geo eligibility per campaign','Mandatory ad disclosure','No guaranteed-win claims','Manual payout approval'].map(x=>`<div class="list-item"><div><strong>✓ ${x}</strong></div></div>`).join('')}</div></div>`}
function compliance(){setHead('Compliance','ADMIN WORKSPACE');app.innerHTML=`<div class="split"><div class="panel"><h3>Campaign launch checklist</h3>${['Brand/operator verification','Allowed market/geo list','18+ requirement','Approved assets & rights confirmation','Responsible-gaming copy','Prohibited claims list','Platform-specific disclosure instructions'].map((x,i)=>`<div class="list-item"><div><strong>${i<6?'✓':'!' } ${x}</strong><br><small>${i<6?'Configured':'Needs confirmation per campaign'}</small></div></div>`).join('')}</div><div class="panel"><h3>Why this exists</h3><p class="muted" style="font-size:12px;line-height:1.7">The hub is designed as a controlled distribution workflow for lawful, licensed campaigns. It does not automate fake engagement, bot posting, account farming, age circumvention, or geo circumvention.</p><div class="notice" style="margin-top:14px">For production, campaign eligibility should be determined from the operator licence, target jurisdiction and each platform's current gambling-ad rules.</div></div></div>`}
function render(){renderNav(); if(role==='clipper'){if(page==='submissions')clipperSubmissions();else if(page==='earnings')earnings();else if(page==='leaderboard')leaderboard();else clipperDashboard()}else if(role==='brand'){if(page==='campaigns')campaignManagement();else if(page==='submissions') {setHead('Submissions','BRAND WORKSPACE');app.innerHTML=submissionTable(state.submissions)} else if(page==='clippers')clippers();else brandDashboard()}else{if(page==='submissions'){setHead('Review queue','ADMIN WORKSPACE');app.innerHTML=submissionTable(state.submissions,true)}else if(page==='campaigns'){setHead('Campaigns','ADMIN WORKSPACE');app.innerHTML=`<div class="grid">${state.campaigns.map(campaignCard).join('')}</div>`}else if(page==='compliance')compliance();else adminDashboard()}}
window.openCampaign=id=>{const c=campaign(id);modalContent.innerHTML=`<div class="modal-inner"><div class="modal-head"><div><div class="eyebrow">${c.brand}</div><h2>${c.title}</h2></div><button class="x" onclick="modal.close()">×</button></div><p class="muted" style="line-height:1.6">${c.brief}</p><div class="meta"><div><span>Payout</span><strong>${c.rate}</strong></div><div><span>Geo</span><strong>${c.geo}</strong></div><div><span>Deadline</span><strong>${c.deadline}</strong></div></div><h3>Requirements</h3>${c.requirements.map(r=>`<div class="list-item"><span>✓ ${r}</span></div>`).join('')}<div class="notice" style="margin-top:14px">Demo rule: only use brand-supplied/authorised source material and add original editing/commentary. Creator must follow local law and platform rules.</div><div class="modal-actions"><button class="secondary" onclick="modal.close()">Close</button>${role==='clipper'?`<button class="primary" onclick="modal.close();claimCampaign('${c.id}')">${state.claims.includes(c.id)?'Submit clip':'Claim campaign'}</button>`:''}</div></div>`;modal.showModal()}
window.claimCampaign=id=>{if(!state.claims.includes(id)){state.claims.push(id);save();toast('Campaign claimed');render();return}openSubmit(id)}
function openSubmit(id){const c=campaign(id);modalContent.innerHTML=`<div class="modal-inner"><div class="modal-head"><div><div class="eyebrow">SUBMIT PROOF</div><h2>${c.title}</h2></div><button class="x" onclick="modal.close()">×</button></div><form class="form" id="submitForm"><div class="field"><label>Published clip URL</label><input name="url" required placeholder="https://www.tiktok.com/@you/video/..." /></div><div class="field"><label>Platform</label><select name="platform"><option>TikTok</option><option>Reels</option><option>Shorts</option><option>X</option></select></div><div class="field"><label>Current public views (demo)</label><input name="views" type="number" min="0" value="1000" /></div><div class="notice">Submission enters manual review. Public views are treated as unverified until moderation.</div><div class="modal-actions"><button type="button" class="secondary" onclick="modal.close()">Cancel</button><button class="primary">Submit clip</button></div></form></div>`;modal.showModal();$('#submitForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);const u=String(f.get('url'));if(!/^https?:\/\//.test(u)){toast('Enter a valid public URL');return}state.submissions.unshift({id:'local-'+Date.now(),campaignId:id,clipper:'@goalframe',url:u,platform:String(f.get('platform')),views:Number(f.get('views')||0),status:'pending',payout:0,submitted:'14 Oct'});save();modal.close();toast('Clip submitted for review');page='submissions';render()}}
window.reviewSubmission=id=>{const s=state.submissions.find(x=>x.id===id),c=campaign(s.campaignId);modalContent.innerHTML=`<div class="modal-inner"><div class="modal-head"><div><div class="eyebrow">MODERATION</div><h2>${s.clipper}</h2></div><button class="x" onclick="modal.close()">×</button></div><div class="list-item"><span>Campaign</span><strong>${c.title}</strong></div><div class="list-item"><span>Platform</span><strong>${s.platform}</strong></div><div class="list-item"><span>Submitted views</span><strong>${s.views.toLocaleString()}</strong></div><form class="form" id="reviewForm" style="margin-top:14px"><div class="field"><label>Verified public views</label><input name="views" type="number" min="0" value="${s.views}" /></div><div class="field"><label>Decision</label><select name="decision"><option value="approved">Approve</option><option value="rejected">Reject</option></select></div><div class="field"><label>Moderator note</label><textarea name="note" placeholder="Rights, disclosure, claim, quality, geo or other review note"></textarea></div><div class="modal-actions"><button type="button" class="secondary" onclick="modal.close()">Cancel</button><button class="primary">Save decision</button></div></form></div>`;modal.showModal();$('#reviewForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),v=Number(f.get('views')||0),d=String(f.get('decision'));s.views=v;s.status=d;s.payout=d==='approved'?(c.rate.includes('/ 1K')?Number((v/1000*4).toFixed(2)):45):0;save();modal.close();toast(`Submission ${d}`);render()}}
window.newCampaign=()=>{modalContent.innerHTML=`<div class="modal-inner"><div class="modal-head"><div><div class="eyebrow">BRAND CAMPAIGN</div><h2>Create campaign</h2></div><button class="x" onclick="modal.close()">×</button></div><form class="form" id="campaignForm"><div class="field"><label>Campaign title</label><input name="title" required placeholder="e.g. Derby Match Reaction" /></div><div class="field"><label>Brand</label><input name="brand" required value="Demo Sportsbook" /></div><div class="field"><label>Approved geos</label><input name="geo" required placeholder="MY / PH" /></div><div class="field"><label>Total budget (USD)</label><input name="budget" type="number" min="100" value="1500" /></div><div class="field"><label>Payout model</label><select name="rate"><option>$4 / 1K verified views</option><option>$45 approved clip</option><option>$35 approved clip + bonus</option></select></div><div class="field"><label>Brief</label><textarea name="brief" required placeholder="Describe the content, supplied assets, claims allowed, disclosure and responsible-gaming requirements."></textarea></div><div class="notice">Production launch should require operator/licence verification and jurisdiction-specific policy review.</div><div class="modal-actions"><button type="button" class="secondary" onclick="modal.close()">Cancel</button><button class="primary">Create demo campaign</button></div></form></div>`;modal.showModal();$('#campaignForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);state.campaigns.unshift({id:'local-c-'+Date.now(),brand:String(f.get('brand')),title:String(f.get('title')),platforms:'TikTok, Reels, Shorts',geo:String(f.get('geo')),budget:Number(f.get('budget')),spent:0,rate:String(f.get('rate')),deadline:'30 Oct',status:'draft',claimed:0,submissions:0,brief:String(f.get('brief')),requirements:['18+ audience','Approved assets only','Ad disclosure','No guaranteed-win claims']});save();modal.close();toast('Draft campaign created');render()}}
$('#roleSelect').value=role;$('#roleSelect').onchange=e=>{role=e.target.value;localStorage.setItem('clipperHubRole',role);page='dashboard';render()};modal.addEventListener('click',e=>{if(e.target===modal)modal.close()});render();
</script>
</body>
</html>
